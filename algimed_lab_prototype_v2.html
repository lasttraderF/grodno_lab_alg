function home(){return top()+`<div class="entry"><div class="eyebrow">Регистрация · испытания · результаты</div><h1>Каждая проба.<br>Весь путь в лаборатории.</h1><p class="intro">Выберите роль и пройдите рабочий процесс: от заявки у заказчика до проверенного протокола. Все примеры вымышленные.</p><div class="rolegrid">${['manager','lab','analyst','head'].map((k,i)=>`<button class="rolecard" data-a="role" data-role="${k}"><span class="eyebrow">0${i+1} / КАБИНЕТ</span><h2>${M.roles[k].name}</h2><p>${({manager:'Заявки с телефона, партии проб и замечания приёмки.',lab:'Поступление, регистрация, движение материала и документы.',analyst:'Обезличенные задания и результаты испытаний.',head:'Согласования, утверждение, история и аналитика.'})[k]}</p><span class="arrow">↗</span></button>`).join('')}</div><div class="entry-bottom"><span class="tiny muted">На старте уже есть заявки ПЦР, ИФА, генетики и продукции.<br>Можно создавать свои и переключать роли в верхнем меню.</span><div class="actions">${btn('Сценарии прототипа','guide-home','','secondary')}${btn('Просмотр отчётов','role','data-role="viewer"','ghost')}</div></div><div style="margin-top:44px;border-top:1px solid var(--line);padding-top:22px" class="row between wrap"><span class="tiny muted">Альгимед ЛАБ · версия 2.1</span><span class="tiny muted">Ролевая демонстрация · общая серверная база не подключена</span></div></div>`}
function requestRows(list){return `<div class="tablewrap"><table><thead><tr><th>Заявка / заказчик</th><th>Направление</th><th>Состояние</th><th>Пробы</th><th>Дата</th><th></th></tr></thead><tbody>${list.map(r=>{const c=counts(r);return `<tr><td><button class="linkbtn mono" data-a="open" data-id="${r.id}">${h(r.number||'Предварительная заявка')}</button><span class="sub">${h(r.customer)}</span></td><td>${h(M.types[r.type].name)}${r.priority?`<span class="sub">${tag('Первоочередно','warm')}</span>`:''}</td><td>${statusTag(r)}${r.hold?`<span class="sub">Ожидает предоплаты</span>`:''}</td><td><b>${r.samples.length}</b><span class="sub">${c.accepted} принято${c.pending?' · '+c.pending+' ожидается':''}${c.rejected?' · '+c.rejected+' отказ':''}</span></td><td>${d(r.created)}</td><td>${btn('Открыть →','open',`data-id="${r.id}"`,'ghost small')}</td></tr>`}).join('')}</tbody></table></div>`}
function overview(){if(db().role==='viewer')return reports();if(db().role==='analyst')return work();const own=ownRequests(),all=own.flatMap(r=>r.samples),ready=own.filter(r=>M.baseStatus(r)==='ready').length;let content=head(db().role==='manager'?'Мои заявки':'Сегодня в лаборатории',db().role==='manager'?'Отправляйте партии проб и следите за приёмкой.':'Заявки, материал и результаты в одном рабочем пространстве.',btn('+ Новая заявка','new','',''));
content+=`<div class="stats">${stat('Заявок на приёмке',own.filter(r=>r.status==='sent').length,'Ожидают регистрации',true)}${stat('Принятых проб',all.filter(s=>s.state==='accepted').length,'По доступным заявкам')}${stat('Готовых результатов',ready,'Заявки с завершёнными испытаниями')}${stat('Ожидают решения',own.filter(r=>r.hold||r.consents.some(c=>c.status==='pending')).length,'Предоплата или типизация')}</div>`;
content+=`<div class="quick"><div><b>Первый проход по прототипу</b><p>${db().role==='manager'?'Откройте заявку «Рассвет», затем переключитесь на приёмку.':'Начните с партии ПЦР: примите пробы, передайте исполнителю и вернитесь к результатам.'}</p></div>${btn('Начать','open','data-id="pcr-new"','')}</div><section class="panel flush"><div class="panelhead"><h2>${db().role==='manager'?'Последние заявки':'Рабочая очередь'}</h2>${btn('Все заявки','nav','data-page="requests"','ghost small')}</div>${requestRows(own.slice(0,6))}</section>`;
if(db().role==='head')content+=`<div class="grid2"><section class="panel"><h2>Нужен руководитель</h2><p class="smallhelp">Решения по работе и выпуску документов</p>${own.filter(r=>r.hold||r.consents.some(c=>c.status==='pending')).map(r=>`<div class="decision row between"><div><b>${h(r.customer)}</b><div class="muted">${r.hold?'Разрешение после предоплаты':'Согласование типизации'}</div></div>${btn('Открыть','open',`data-id="${r.id}"`,'secondary small')}</div>`).join('')||'<p class="muted" style="margin-top:15px">Ожидающих решений нет.</p>'}</section><section class="panel"><div class="eyebrow">Отчётность</div><h2 style="margin:12px 0">Результаты по областям</h2><p class="muted tiny">Показатели ПЦР и ИФА считаются раздельно. Количество проб и исследований различается.</p><div style="margin-top:20px">${btn('Открыть аналитику','nav','data-page="reports"','secondary')}</div></section></div>`;return layout(content)}
function requests(){let list=ownRequests().filter(r=>(tab==='all'||(tab==='intake'?r.status==='sent':tab==='ready'?M.baseStatus(r)==='ready':r.status===tab))&&[r.customer,r.number,r.act].join(' ').toLowerCase().includes(query.toLowerCase()));return layout(head(db().role==='manager'?'Мои заявки':'Заявки','Поиск и состояние всех доступных заявок.',btn('+ Новая заявка','new','',''))+`<section class="panel flush"><div class="tabs">${[['all','Все'],['intake','На приёмке'],['ready','Результаты готовы'],['draft','Черновики'],['cancelled','Аннулированы']].map(([k,n])=>`<button class="${tab===k?'active':''}" data-a="tab" data-tab="${k}">${n}</button>`).join('')}</div><div class="toolbar"><input id="search" value="${h(query)}" placeholder="Заказчик или номер заявки" aria-label="Поиск заявок">${tag(list.length+' заявок')}</div>${list.length?requestRows(list):empty('Заявок не найдено','Попробуйте другой запрос или вкладку.')}</section>`)}
function process(r){const st=M.baseStatus(r),index=st==='sent'?0:st==='registered'?1:st==='work'?2:st==='ready'?3:0;return `<div class="stepper" aria-label="Путь заявки">${['Заявка','Приёмка','Испытания','Документ'].map((x,i)=>`<div class="step ${i===index?'active':i<index?'done':''}"><b>${i<index?'✓':i+1}</b>${x}</div>`).join('')}</div>`}
function summary(r){return `<div class="summary"><div><small>ЗАКАЗЧИК</small><strong>${h(r.customer)}</strong></div><div><small>МЕТОД / НАПРАВЛЕНИЕ</small><strong>${h(M.types[r.type].name)}</strong></div><div><small>ОТБОР</small><strong>${dt(r.collected)}</strong></div><div><small>АКТ / ДОГОВОР</small><strong>${h(r.act||'б/н')} · ${h(r.contract||'не указан')}</strong></div></div>`}
function auditList(list){return list.slice(0,60).map(e=>`<div class="audit-row"><div>${dt(e.time)}</div><div>${h(e.person)}</div><p>${h(e.text)}${e.before||e.after?`<br><small>Было: ${h(e.before||'—')} · Стало: ${h(e.after||'—')}</small>`:''}</p></div>`).join('')||'<p class="muted tiny">История появится после первого действия.</p>'}
function requestView(){const r=M.find(selected);if(!r||!M.roleCan(r))return layout(empty('Заявка недоступна'));if(db().role==='analyst'){page='results';return results()};const manager=db().role==='manager',headRole=db().role==='head',c=counts(r);let actions=btn('← К списку','nav','data-page="requests"','secondary');if(r.status==='draft'&&(manager||!manager))actions+=btn('Редактировать','edit-draft',`data-id="${r.id}"`,'');if(headRole&&r.status!=='draft')actions+=btn('Изменить','correct-request','','secondary');let content=head(r.number?'Заявка '+r.number:'Предварительная заявка',h(r.customer),actions)+process(r);
 if(r.status==='cancelled')content+=note('Заявка аннулирована. Причина: '+h(r.cancelReason)+'. Номера сохранены.','warm');

 if(!manager&&r.status!=='draft'&&r.status!=='cancelled')content+=`<div class="quick"><div><b>${r.samples.some(s=>s.state==='accepted'&&!s.number)?'Зафиксируйте регистрацию принятых проб':r.samples.some(s=>s.work==='queued')?'Передайте зарегистрированные пробы исполнителю':r.samples.some(s=>s.work==='sent')?'Пробы переданы, ожидается получение':M.baseStatus(r)==='ready'?'Результаты готовы к оформлению':c.pending?'Отметьте состояние поступивших проб':'Продолжите работу с заявкой'}</b><p>${c.accepted} принято · ${c.pending} ожидается · ${c.rejected} не принято</p></div><div class="actions">${r.samples.some(s=>s.state==='accepted'&&!s.number)?btn('Зарегистрировать','register','',''):r.samples.some(s=>s.work==='queued')?btn('Передать исполнителю','transmit','',''):r.samples.some(s=>s.work==='sent')?btn('Кабинет исполнителя','handoff','',''):M.baseStatus(r)==='ready'?btn('Подготовить документ','prepare','',''):''}</div></div>`;
 content+=`<section class="panel">${summary(r)}<div class="badge-line">${statusTag(r)}${tag(r.region+' область')}${r.priority?tag('Первоочередно','warm'):''}${r.returnWanted?tag('Вернуть остаток'):''}</div><details style="margin-top:18px"><summary class="tiny" style="cursor:pointer">Сведения об отборе и доставке</summary><div class="fields two" style="margin-top:17px"><div class="tiny"><b>Место отбора</b><p class="muted">${h(r.place||'не указано')}</p><b>Отборщик</b><p class="muted">${h(r.collector||'не указан')}</p>${manager||headRole||db().settings.contactLab?`<b>Контакт по заявке</b><p class="muted">${h(r.contact)} · ${h(r.phone)}</p>`:'<p class="muted">Контактные данные доступны менеджеру и руководителю.</p>'}</div><div class="tiny"><b>Доставка</b><p class="muted">${h(r.delivery)} · ${h(r.temperature||'не указана')} °C</p><b>Получено</b><p class="muted">${dt(r.received)}</p>${r.type==='ifa'?`<b>Вакцинация</b><p class="muted">${h(r.vaccineState==='provided'?r.vaccine+' · '+d(r.vaccineDate):r.vaccineState==='none'?'Не вакцинировано':'Сведения неизвестны')}</p>`:''}</div></div></details></section>`;
 if(!manager&&r.status!=='draft'&&r.status!=='cancelled'&&c.pending)content+=`<section class="panel"><div class="row between wrap"><div><h2>Параметры приёмки</h2><p class="smallhelp">Фактические сведения фиксируются в истории регистрации</p></div>${btn('Принять поступившие','accept-arrived','','secondary small')}</div><div class="fields" style="margin-top:16px">${sel('Способ доставки','delivery',['менеджер','заказчик / водитель','почта / курьер'],r.delivery,'data-request-field')}${inp('Температура при поступлении, °C','temperature',r.temperature,'data-request-field')}${inp('Фактическая дата и время','received',r.received?.slice(0,16)||M.now().slice(0,16),'data-request-field','datetime-local')}</div></section>`;
 content+=`<section class="panel flush"><div class="panelhead"><h2>Пробы <span class="muted">${r.samples.length}</span></h2><div class="actions">${!manager?btn('Этикетки · макет','labels','','ghost small'):''}${headRole?btn(r.priority?'Снять срочность':'Первоочередно','priority','','secondary small'):''}</div></div><div class="tablewrap"><table><thead><tr><th>Обозначение / материал</th><th>Рег. номер</th><th>Исследования</th><th>Состояние</th><th>Действия</th></tr></thead><tbody>${r.samples.slice(0,100).map(s=>`<tr><td><b>${h(s.label)}</b><span class="sub">${h(s.material)} · ${h(s.group||s.species)}</span>${s.delayed&&s.state==='pending'?'<span class="sub">Заявлена, поступит позже</span>':''}</td><td class="mono">${h(s.number||'—')}<span class="sub">${s.number?'Поступление '+s.physical:''}</span></td><td>${s.tests.map(k=>`<span class="sub">${h(k)} · ${h(db().catalog[k]?.name||k)}</span>`).join('')}</td><td>${tag(s.state==='accepted'?'Принята':s.state==='rejected'?'Не принята':s.state==='cancelled'?'Аннулирована':'Ожидается',s.state==='accepted'?'good':s.state==='rejected'?'warm':'')}${s.reason?`<span class="sub">${h(s.reason)}</span>`:''}${s.work!=='none'?`<span class="sub">${h(workName(s.work))}</span>`:''}</td><td><div class="actions">${!manager&&(s.state==='pending'||(s.state==='accepted'&&!s.number))&&r.status!=='cancelled'?btn('Принять','accept',`data-sid="${s.id}"`,'secondary small')+btn('Отказ','reject',`data-sid="${s.id}"`,'ghost small'):''}${!manager&&s.state==='accepted'&&s.number&&r.status!=='cancelled'?btn('+ Исследование','extra',`data-sid="${s.id}"`,'secondary small'):''}${headRole&&s.number?btn('Аннулировать пробу','cancel-sample',`data-sid="${s.id}"`,'ghost small')+btn('Правка','correct-sample',`data-sid="${s.id}"`,'ghost small')+btn('Перезабор','replace',`data-sid="${s.id}"`,'ghost small'):''}</div></td></tr>`).join('')}</tbody></table></div>${r.samples.length>100?'<div class="pagination">В карточке показаны первые 100 проб. Полный перечень доступен в реестре.</div>':''}</section>`;
 if(r.consents.length)content+=`<section class="panel"><h2>Дополнительные исследования</h2>${r.consents.map(x=>`<div class="decision row between wrap"><div><b>${h(db().catalog[x.code||'TYPING']?.name||'Дополнительное исследование')} · ${x.samples.length} проб</b><p class="muted">${h(x.note)}</p>${tag(({pending:'Ожидает согласия',approved:'Согласовано',declined:'Отказ заказчика'})[x.status],x.status==='approved'?'good':'')}</div>${!manager&&x.status==='pending'?`<div class="actions">${btn('Заказчик согласен','consent-yes',`data-cid="${x.id}"`,'secondary small')}${btn('Отказался','consent-no',`data-cid="${x.id}"`,'ghost small')}</div>`:''}</div>`).join('')}</section>`;
 if(!manager&&r.docs.length)content+=`<section class="panel"><h2>Документы</h2>${r.docs.map(x=>`<div class="decision row between wrap"><div><b>${h(x.number)}</b> · версия ${x.version} ${tag(docState(x.status))}</div>${btn('Открыть','doc',`data-doc="${x.id}"`,'secondary small')}</div>`).join('')}</section>`;
 content+=`<section class="panel"><div class="row between"><h2>История заявки</h2>${headRole&&r.status!=='cancelled'?btn('Аннулировать заявку','cancel','','danger small'):''}</div><div style="margin-top:13px">${auditList(r.audit)}</div></section>`;return layout(content)}
const workName=s=>({none:'Не зарегистрирована',queued:'Ожидает передачи',sent:'Передана исполнителю',received:'У исполнителя',done:'Испытание завершено'})[s]||s;
const docState=s=>({draft:'Проект',approved:'Утверждён',issued:'Выдан'})[s]||s;

if(formStep===1){content+=`<section class="panel"><h2>Заявка и заказчик</h2><div class="fields" style="margin-top:20px">${sel('Вид испытания','type',Object.entries(M.types).map(([k,v])=>[k,v.name]),form.type,'data-draft')}${inp('Заказчик *','customer',form.customer,'data-draft placeholder="Краткое название организации"')}${sel('Область','region',M.regions,form.region,'data-draft')}${inp('Договор: номер и дата','contract',form.contract,'data-draft')}${inp('Цель испытаний','purpose',form.purpose,'data-draft')}${inp('Акт отбора: номер или б/н','act',form.act,'data-draft')}</div></section><section class="panel"><h2>Отбор биоматериала</h2><div class="fields" style="margin-top:20px">${inp('Дата и время отбора','collected',form.collected,'data-draft','datetime-local')}${inp('Место отбора','place',form.place,'data-draft')}${inp('Сотрудник, проводивший отбор','collector',form.collector,'data-draft')}${inp('Контакт по этой заявке','contact',form.contact,'data-draft')}${inp('Телефон','phone',form.phone,'data-draft','tel')}${sel('Вернуть остатки после испытаний','returnWanted',[[false,'Не требуется'],[true,'Да, вернуть заказчику']],String(form.returnWanted),'data-draft')}</div></section>`;

function docTitle(type){return ({snp:'Отчёт по генотипированию',origin:'Генетический сертификат',genetic:'Протокол генетических испытаний',product:'Протокол испытаний продукции',ifa:'Протокол испытаний ИФА',pcr:'Протокол испытаний ПЦР',mastitis:'Протокол испытаний ПЦР · маститы'})[type]}

function docView(){const r=M.find(selected),doc=r?.docs.find(d=>d.id===docId);if(!doc||!['head','lab'].includes(db().role))return layout(empty('Документ не найден'));const snap=doc.snapshot;let actions=btn('← Документы','nav','data-page="documents"','secondary');if(doc.status==='draft'&&db().role==='head')actions+=btn('Утвердить','approve-doc','','');if(doc.status==='approved')actions+=btn('Отметить выдачу','issue-doc','','');actions+=btn('Печать / PDF','print','','secondary');actions+=btn('Скачать HTML','download-doc','','secondary');let content=head(docTitle(snap.type),`${h(doc.number)} · версия ${doc.version} · ${docState(doc.status)}`,actions);if(doc.status==='draft')content+=note('Это проект для проверки. Проведение испытания, подготовка и утверждение учитываются отдельно. До выдачи подтвердите данные и полноту результатов.');if(snap.samples.length<r.samples.filter(s=>s.state!=='rejected').length)content+=note('В документ включена только завершённая часть заявки. Ожидаемые и незавершённые пробы не выданы как готовые.','warm');content+=`<article class="doc" id="document-preview"><div class="watermark">ДЕМОНСТРАЦИОННЫЙ ДОКУМЕНТ · НЕ ДЛЯ ВЫДАЧИ РЕАЛЬНОМУ ЗАКАЗЧИКУ</div><div class="row between">${logo}<div style="text-align:right"><b>Альгимед ЛАБ</b><br><small>Учебный шаблон · реквизиты организации задаются отдельно</small></div></div><h2>${h(docTitle(snap.type))}<br>№ ${h(doc.number)}</h2><table><tbody><tr><th>Заказчик</th><td>${h(snap.customer)}</td><th>Акт отбора</th><td>${h(snap.act)}</td></tr><tr><th>Дата приёмки</th><td>${d(snap.received)}</td><th>Период испытаний</th><td>${d(snap.testStart)} — ${d(snap.testEnd)}</td></tr><tr><th>Условия испытаний</th><td colspan="3">${h(snap.conditions||'Не указаны в демонстрации')}</td></tr></tbody></table><h3 style="margin:25px 0 15px">Результаты испытаний</h3>${docTable(snap)}<p class="tiny" style="margin-top:15px">Результаты относятся к предоставленным образцам. Обозначения и сведения об отборе перенесены из заявки заказчика.</p><div class="signatures"><div><p>Испытание провёл</p><b>${h(doc.tester)}</b></div><div><p>Документ подготовил</p><b>${h(doc.prepared)}</b></div><div><p>Проверил и утвердил</p><b>${h(doc.approver)}</b><br>${doc.approved?dt(doc.approved):'Ожидает утверждения'}</div></div><div class="docfoot">Версия ${doc.version}. Создан ${d(doc.created)}. ${doc.issued?'Выдан '+d(doc.issued):'Выдача не зафиксирована'}.<br>Для рабочего выпуска требуется утверждённый шаблон, ТНПА и полный состав обязательных полей.</div></article>`;return layout(content)}
function aggregate(){const rows=[];for(const r of db().requests){if(r.status==='cancelled'||(reportRegion!=='all'&&r.region!==reportRegion)||(reportMethod!=='all'&&r.type!==reportMethod))continue;for(const s of r.samples)if(s.state==='accepted'&&s.work==='done'){for(const k of M.targets(db(),r,s)){const v=s.results[k];if(v==='+'||v==='−'||v==='-')rows.push({r,s,key:k,value:v});}}}return rows}
function reports(){if(!['head','viewer'].includes(db().role))return layout(empty('Раздел недоступен'));const rows=aggregate(),rs=db().requests.filter(r=>r.status!=='cancelled'&&(reportRegion==='all'||r.region===reportRegion)&&(reportMethod==='all'||r.type===reportMethod)),ss=rs.flatMap(r=>r.samples),positive=rows.filter(x=>x.value==='+').length;const by=new Map;rows.forEach(x=>{const k=x.r.type+'::'+x.key;const old=by.get(k)||{name:M.targetName(x.key),method:M.types[x.r.type].name,total:0,positive:0};old.total++;old.positive+=x.value==='+'?1:0;by.set(k,old)});return layout(head('Аналитика лаборатории','Заявки, пробы и показатели считаются раздельно.',btn('Экспорт сводки CSV','export-reports','','secondary'))+`<section class="panel flush"><div class="toolbar" style="border:0">${sel('Метод','report-method',[['all','Все методы'],...Object.entries(M.types).map(([k,v])=>[k,v.name])],reportMethod,'id="report-method"')}${sel('Область','report-region',[['all','Все области'],...M.regions],reportRegion,'id="report-region"')}<span class="tiny muted">Все демонстрационные даты · итоговое выполнение исследования</span></div></section><div class="stats">${stat('Заявок',rs.length,'Без аннулированных',true)}${stat('Принято физических проб',ss.filter(s=>s.state==='accepted').length,'Количество принятых позиций')}${stat('Завершённых показателей +/−',rows.length,'ПЦР и ИФА · пригодные итоги')}${stat('Положительная доля',rows.length?Math.round(positive/rows.length*100)+'%':'—',positive+' положительных показателей')}</div>`+note('ПЦР и ИФА показаны разными строками. Неопределённые, пустые, недействительные и количественные значения не превращаются в отрицательные. Эта сводка не является оценкой заболеваемости.')+`<div class="grid2"><section class="panel flush"><div class="panelhead"><h2>Исследованные показатели</h2></div><div class="tablewrap"><table><thead><tr><th>Показатель / метод</th><th>Всего +/−</th><th>Положительных</th><th>Доля</th></tr></thead><tbody>${[...by.values()].map(x=>`<tr><td>${h(x.name)}<span class="sub">${h(x.method)}</span></td><td>${x.total}</td><td>${x.positive}</td><td>${Math.round(x.positive/x.total*100)}%</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Нет завершённых качественных результатов. Пройдите сценарий испытания или выберите другой фильтр.</td></tr>'}</tbody></table></div></section><section class="panel"><h2>Принятые пробы по областям</h2><div class="bars">${M.regions.map(region=>{const n=rs.filter(r=>r.region===region).flatMap(r=>r.samples).filter(s=>s.state==='accepted').length,max=Math.max(1,...M.regions.map(x=>rs.filter(r=>r.region===x).flatMap(r=>r.samples).filter(s=>s.state==='accepted').length));return `<div class="bar-row"><span>${region}</span><div class="bar-track"><div class="bar-fill" style="width:${n/max*100}%"></div></div><b>${n}</b></div>`}).join('')}</div><p class="chart-caption">Область хранится отдельным полем. Цвет ячейки из старой книги не используется как рабочее значение.</p></section></div><section class="panel"><h2>Исторические данные</h2><p class="muted tiny" style="margin-top:10px">Перенос Excel проводится отдельно: подробный реестр, сопоставленные результаты и агрегированная статистика. Суммарные числа не разворачиваются в вымышленные индивидуальные пробы. В этом прототипе реальная история не загружена.</p></section>`)}

function chooseTests(values,callback){const method=form?.type||'pcr',isPcr=['pcr','mastitis'].includes(method);const allowed=Object.values(db().catalog).filter(x=>isPcr?['pcr','mastitis'].includes(x.method):method==='ifa'?x.method==='ifa':x.method===method);showModal('Назначить исследования',`<p class="muted tiny">Выберите профиль или отдельные испытания. Профиль содержит несколько показателей; при пересечении составов проверьте назначения.</p><div style="max-height:52vh;overflow:auto;margin-top:15px">${allowed.map(x=>`<label class="checkrow"><input type="checkbox" name="tests" value="${h(x.code)}" ${values.includes(x.code)?'checked':''}><span><b>${h(x.code)}</b> · ${h(x.name)}<br><small class="muted">${x.targets.length} показателей</small></span></label>`).join('')}</div>`,()=>{const codes=[...document.querySelectorAll('input[name=tests]:checked')].map(x=>x.value);if(!codes.length)throw Error('Выберите хотя бы одно исследование');callback(codes);render()},'Применить',true)}
function fillExample(r){for(const [i,s] of r.samples.entries()){if(s.state!=='accepted'||s.work!=='received')continue;if(r.type==='snp')Object.assign(s.extraData,{chip:'Демонстрационный SNP-50',snp:'50000',validity:'0.995',interpretation:'Пригоден к дальнейшему анализу'});else if(r.type==='origin'){for(const [j,k]of(s.species==='свиньи'?M.pigMarkers:M.markers).entries())s.results[k]=(100+j*3)+'/'+(104+j*3);Object.assign(s.extraData,{mother:'BY000000008001',father:'BY000000008002',motherDecision:'подтверждается',fatherDecision:'подтверждается'})}else for(const [j,k]of M.targets(db(),r,s).entries()){s.results[k]=k.startsWith('TYPING::')?'Демонстрационный тип A':r.type==='mastitis'?'~ 1,2×10^3':r.type==='product'?'В учебном образце выявлен казеин А2':r.type==='genetic'?(M.targetName(k)==='CSN2'?'A2/A2':j===2&&i===0?'C':'F'):(i+j)%4===0?'+':'−';}for(const k of M.targets(db(),r,s)){if(k.startsWith('TYPING::'))s.results[k]='Демонстрационный тип A';if(k.startsWith('GEN-EXTRA::'))s.results[k]='F';}if(r.type==='mastitis')s.control='valid';}r.conditions='t 22–23 °C · влажность 40–45%';r.testStart=r.testStart||M.date();r.testEnd=M.date();persist();render();toast('Вставлены вымышленные значения для демонстрации интерфейса')}
function download(name,text,mime='text/plain'){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type:mime}));a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function csv(rows){return '\uFEFF'+rows.map(row=>row.map(v=>{let t=String(v??'');if(/^[=+@\-]/.test(t))t="'"+t;return '"'+t.replace(/"/g,'""')+'"'}).join(';')).join('\r\n')}

case'download-doc':{requireRole('lab','head');const r=current(),doc=r.docs.find(d=>d.id===docId);const styles=document.querySelector('style').textContent;download('Альгимед_демо_'+doc.number.replace(/[\/\\]/g,'_')+'_v'+doc.version+'.html','<!doctype html><html lang="ru"><meta charset="utf-8"><title>Демонстрационный документ</title><style>'+styles+'</style><body>'+$('document-preview').outerHTML+'<\/body><\/html>','text/html');break}
case'labels':go('labels',selected);break;
case'storage-action':{requireRole('lab','head');const r=M.find(b.dataset.id),s=getSample(r,b.dataset.sid);showModal('Материал № '+h(s.number),sel('Действие','fate',[['stored','Переместить на хранение'],['returned','Вернуть заказчику'],['disposed','Утилизировать']],s.fate==='stored'?'stored':s.fate,'id="storage-fate"')+inp('Место хранения / комментарий','location',s.location,'id="storage-location"')+textarea('Основание / примечание','reason','','id="storage-reason"'),()=>{const fate=$('storage-fate').value,reason=$('storage-reason').value.trim();if(['returned','disposed'].includes(fate)&&s.work!=='done'&&r.status!=='cancelled'&&s.state!=='cancelled')throw Error('Сначала завершите или аннулируйте работу с этой пробой');if(['returned','disposed'].includes(fate)&&!reason)throw Error('Укажите основание');const before=s.fate+' · '+s.location;s.fate=fate;s.location=$('storage-location').value;s.fateAt=M.now();M.audit(r,'Движение материала '+s.number+'. '+reason,before,fateName(fate)+' · '+s.location);persist();render()},'Зафиксировать');break}
case'add-catalog':{requireRole('head');showModal('Новое исследование',inp('Уникальный код','code','','id="cat-code"')+inp('Название','name','','id="cat-name"')+sel('Метод','method',[['pcr','ПЦР'],['ifa','ИФА'],['genetic','Генетика']],'pcr','id="cat-method"')+textarea('Показатели: один на строку','targets','','id="cat-targets"'),()=>{const code=$('cat-code').value.trim(),name=$('cat-name').value.trim(),targets=$('cat-targets').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!code||!name||!targets.length)throw Error('Заполните код, название и показатели');if(db().catalog[code])throw Error('Код уже существует');db().catalog[code]={code,name,method:$('cat-method').value,type:targets.length>1?'profile':'single',targets};M.audit(null,'Добавлено исследование '+code);persist();render()},'Создать');break}
case'export-registry':{requireRole('lab','head');download('Альгимед_реестр.csv',csv([['Рег. номер','Заявка','Обозначение','Материал','Состояние','Поступление'],...db().requests.flatMap(r=>r.samples.filter(s=>s.number).map(s=>[s.number,r.number,s.label,s.material,workName(s.work),s.physical]))]),'text/csv;charset=utf-8');break}
case'export-reports':{requireRole('head','viewer');download('Альгимед_результаты.csv',csv([['Метод','Область','Рег. номер','Показатель','Результат'],...aggregate().map(x=>[M.types[x.r.type].name,x.r.region,x.s.number,M.targetName(x.key),x.value])]),'text/csv;charset=utf-8');break}
case'backup':requireRole('head');download('Альгимед_демо_резервная_копия.json',JSON.stringify(db(),null,2),'application/json');break;
case'reset':requireRole('head');showModal('Начать демонстрацию заново','<p>Ваши изменения этой демонстрации будут заменены начальными учебными примерами. При необходимости сначала скачайте резервную копию.</p>',()=>{M.reset();form=null;page='home';render()},'Сбросить демоданные');break;
case'scenario':{const x=scenarios[Number(b.dataset.index)];if(x[3]==='manager2'){db().role='manager';db().manager='manager2'}else{db().role=x[3];db().manager='manager'}persist();if(x[4]==='new')startNew();else go(x[4],x[5]);toast(x[2]);break}
case'sampling-help':showModal('Памятка перед отправкой проб','<ol><li>Выберите материал и нужное исследование.</li><li>Укажите обозначение каждой пробы и сверьте его с пробиркой.</li><li>Зафиксируйте место, дату отбора и сотрудника.</li><li>Подготовьте акт отбора и контакт по заявке.</li><li>Уточните у лаборатории актуальные условия для выбранного материала и способа подготовки.</li><li>При доставке передайте сведения об условиях транспортировки.</li></ol><p class="tiny muted">Подробные условия зависят от материала и методики. Справочник в рабочей системе заполняется по актуальной утверждённой инструкции лаборатории.</p>');break;
case'about':showModal('О прототипе','<p>Это демонстрация интерфейса на вымышленных данных. Роли переключаются для просмотра сценариев. Данные сохраняются в текущем браузере и не передаются на другие устройства.</p><p style="margin-top:12px">Камера, рабочий штрихкод, ЭЦП, приборы, 1С и отправка реальных документов пока не подключены. Настоящие права и общая база появятся в серверной версии.</p>');break;
default:break;} }catch(err){toast(err.message);console.error(err)}});
function handleValue(e){const el=e.target;try{if(el.id==='mobile-nav'){if(el.value==='new')startNew();else go(el.value);return}if(el.id==='search'){query=el.value;render();return}if(el.id==='report-method'){reportMethod=el.value;render();return}if(el.id==='report-region'){reportRegion=el.value;render();return}
if(el.hasAttribute('data-draft')){if(!form)return;let val=el.value;if(el.name==='returnWanted')val=val==='true';form[el.name]=val;if(el.name==='type'){form.dir=M.types[val].dir;const sample=M.sample(1,val);form.commonMaterial=sample.material;form.commonSpecies=sample.species;form.commonTests=[M.types[val].code];for(const s of form.samples){s.material=sample.material;s.species=sample.species;s.tests=[...form.commonTests]}render()}return}
if(el.dataset.sampleField){const s=form?.samples.find(s=>s.id===el.dataset.sid);if(s)s[el.dataset.sampleField]=el.value;return}
if(el.dataset.symptom){form.symptoms=el.checked?[...new Set([...form.symptoms,el.dataset.symptom])]:form.symptoms.filter(x=>x!==el.dataset.symptom);return}
if(el.hasAttribute('data-request-field')){requireRole('lab','head');const r=current(),before=r[el.name];r[el.name]=el.value;M.audit(r,'Приёмка: изменено '+el.name,before,el.value);persist();return}
if(el.hasAttribute('data-run-field')){requireRole('analyst','head');const r=current();if(!r.samples.some(s=>s.work==='received'))throw Error('Изменения доступны во время выполнения испытания');r[el.name]=el.value;persist();return}
if(el.dataset.result||el.dataset.extra||el.hasAttribute('data-control')){requireRole('analyst','head');const r=current(),s=getSample(r,el.dataset.sid);if(s.work!=='received')throw Error('Результаты доступны после получения материала');if(el.dataset.result){s.results[el.dataset.result]=el.value;if(r.type==='mastitis'){s.resultMeta=s.resultMeta||{};s.resultMeta[el.dataset.result]={raw:el.value,approximate:/[~≈]/.test(el.value),unit:r.resultUnit||'',status:'Введено вручную'};}}else if(el.dataset.extra)s.extraData[el.dataset.extra]=el.value;else s.control=el.value;persist();return}
if(el.dataset.setting){requireRole('head');const before=db().settings[el.dataset.setting];db().settings[el.dataset.setting]=el.checked;M.audit(null,'Изменена настройка '+el.dataset.setting,before,el.checked);persist();return}
}catch(err){toast(err.message)}}
document.addEventListener('change',handleValue);
document.addEventListener('input',e=>{if(e.target.hasAttribute('data-draft')||e.target.dataset.sampleField||e.target.dataset.result||e.target.dataset.extra||e.target.hasAttribute('data-run-field')){if(e.target.tagName!=='SELECT')handleValue(e)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){closeModal();return}if(e.target.id==='search'&&e.key==='Enter'){query=e.target.value;render();return}if(e.key==='Tab'&&modal){const nodes=[...document.querySelectorAll('.modal button:not(:disabled),.modal input:not(:disabled),.modal select:not(:disabled),.modal textarea:not(:disabled),.modal a[href]')];const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});
window.addEventListener('storage',e=>{if(e.key===M.KEY)toast('Данные изменились в другой вкладке. Обновите страницу перед продолжением.')});
render();
})();
</script>
</body></html>
