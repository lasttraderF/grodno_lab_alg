  function layout(content){let links=role==='manager'?[['dashboard','Мои заявки'],['new','Новая заявка']]:[['dashboard','Обзор'],['registry','Реестр образцов'],['new','Новая заявка'],['import','Импорт Excel']];return `<div class="shell"><aside class="side"><div class="kicker side-label">Разделы</div><nav class="nav" aria-label="Разделы">${links.map(([p,n])=>`<button class="${page===p?'active':''}" data-action="go" data-page="${p}">${n}</button>`).join('')}</nav><div class="side-bottom">Роль: <b>${roleNames[role]}</b><br>Данные этой демонстрации хранятся в текущем браузере.</div></aside><main class="main">${content}</main></div>`}
  function renderHome(){return `<div class="entry"><div class="entry-head"><div class="kicker">Демонстрация рабочего процесса</div><h1>Регистрация образцов<br>от хозяйства до лаборатории</h1><p>Выберите роль, чтобы посмотреть её задачи и пройти путь одной заявки. Это демонстрация интерфейса без общей серверной базы.</p></div><div class="role-grid">${['manager','lab','head'].map((r,i)=>`<button class="role-card" data-action="role" data-role="${r}"><span class="number">0${i+1} / РОЛЬ</span><h2>${roleNames[r]}</h2><p>${r==='manager'?'Вносит пробы у заказчика и отправляет заявку.':r==='lab'?'Сверяет, принимает и регистрирует образцы.':'Рассматривает исправления и особые случаи.'}</p><span class="arrow">↗</span></button>`).join('')}</div><div class="entry-foot">Знак модуля регистрации — концепт для прототипа. Реальные данные лаборатории сюда не загружены.</div></div>`}

  function renderDash(){const own=role==='manager'?data.filter(x=>x.owner==='manager'):data;let pending=data.filter(x=>x.status==='sent');let reg=data.filter(x=>x.status==='registered'||x.status==='partial');let buttons=`<button class="btn" data-action="new">+ Новая заявка</button>`;let content=header(role==='manager'?'Мои заявки':'Рабочий стол',role==='manager'?'Черновики и заявки, которые вы отправили в лабораторию.':'Поступающие заявки и последние действия лаборатории.',buttons);

  function renderNew(){if(!draft)draft={direction:role==='manager'?'inf':'gen',customer:'',contract:'',samples:[newSample()]};let content=header('Новая заявка',role==='manager'?'Предварительная заявка до поступления проб в лабораторию.':'Ручная регистрация поступающих проб.',`<button class="btn secondary" data-action="go" data-page="dashboard">Вернуться</button>`);
   content+=`<div class="callout">${role==='manager'?'Официальные номера присвоит лаборатория после сверки проб.':'После создания заявка появится в очереди приёмки; сверьте и подтвердите её.'}</div><section class="panel"><h2>Сведения о заявке</h2><div class="field-grid"><label class="field"><span>Направление *</span><select id="direction" ${role==='manager'?'disabled':''}><option value="gen" ${draft.direction==='gen'?'selected':''}>Генетические испытания</option><option value="inf" ${draft.direction==='inf'?'selected':''}>Вирусно-инфекционные испытания</option></select></label>${field('Организация *',draft.customer,'customer','id="customer" placeholder="Название хозяйства"')}${field('Договор (необязательно)',draft.contract,'contract','placeholder="Номер и дата договора"')}</div></section><div class="section-label"><h2>Пробы <span class="muted">${draft.samples.length}</span></h2><button class="btn secondary small" data-action="add-draft-sample">+ Добавить пробу</button></div>${draft.samples.map((s,i)=>sampleEditor(s,i,draft.direction)).join('')}<div class="panel"><div class="footer-actions"><button class="btn secondary" data-action="save-draft">Сохранить черновик</button><button class="btn" data-action="submit-draft">${role==='manager'?'Отправить в лабораторию':'Создать и перейти к приёмке'}</button></div></div>`;

  function renderRequest(){let req=find(selected);if(!req)return renderDash();let manager=role==='manager';let isPending=req.status==='sent';let buttons=`<button class="btn secondary" data-action="go" data-page="dashboard">← К списку</button>${req.status==='draft'&&(req.owner===role||role==='head')?`<button class="btn" data-action="edit-draft">Редактировать черновик</button>`:''}`;let content=header(req.number?`Заявка ${req.number}`:'Предварительная заявка',req.customer,buttons);

  function renderRegistry(){let all=data.flatMap(req=>req.samples.filter(s=>s.number).map(s=>({req,s})));let filtered=all.filter(x=>(registryTab==='all'||x.req.direction===registryTab)&&[x.s.number,x.s.identifier,x.req.customer,x.req.number].join(' ').toLowerCase().includes(registryQuery.toLowerCase()));let content=header('Реестр образцов','Поиск по номеру образца, заявке, заказчику или обозначению.',`<button class="btn secondary" data-action="export">Экспорт CSV</button>`);

  function renderImport(){let content=header('Импорт Excel','Демонстрация будущего переноса данных из существующей книги.',`<button class="btn secondary" data-action="go" data-page="dashboard">← Назад</button>`);content+=`<div class="callout warm">Этот раздел показывает будущий процесс. Файл сейчас не загружается, и данные реестра не изменяются.</div><section class="panel"><h2>Загрузить Excel</h2><p class="muted">1. Выбрать книгу · 2. Сопоставить столбцы · 3. Проверить повторы и пустые поля · 4. Руководитель подтверждает импорт.</p><div class="field-grid"><label class="field"><span>Исходный файл</span><input value="База регистрации РАБОЧАЯ (Агро).xlsx" disabled></label><label class="field"><span>Лист</span><select disabled><option>Генетика / Инфекционка</option></select></label></div><div class="footer-actions"><button class="btn secondary" data-action="import-demo">Выбрать файл · демонстрация</button></div></section><section class="panel"><h3>Что покажет предварительная проверка</h3><div class="check-list"><span class="test-chip">Номера заявок</span><span class="test-chip">Повторные обозначения</span><span class="test-chip">Назначения исследований</span><span class="test-chip">Строки, требующие уточнения</span></div><p class="muted tiny" style="margin:16px 0 0">Окончательное подтверждение импорта — право руководителя.</p></section>`;return layout(content)}
  function render(){const el=$('app');$('switchRole').style.display=role?'inline-flex':'none';el.innerHTML=!role?renderHome():page==='dashboard'?renderDash():page==='new'?renderNew():page==='request'?renderRequest():page==='registry'?renderRegistry():page==='import'?renderImport():renderDash();renderModal()}

  function submitDraft(onlySave){if(!draft)return;let customer=draft.customer.trim();if(!customer){alert('Укажите организацию');$('customer')?.focus();return}if(!draft.samples.length||draft.samples.some(s=>!s.identifier.trim()||!s.type)){alert('Укажите обозначение и тип для каждой пробы');return}let req={id:uid(),source:role==='manager'?'manager':'lab',owner:role,direction:draft.direction,customer,contract:draft.contract,created:today(),submitted:onlySave?'':today(),received:'',status:onlySave?'draft':'sent',number:'',samples:draft.samples.map(({showTests,...s})=>s),audit:[]};audit(req,onlySave?`${roleNames[role]} сохранил черновик`:`${roleNames[role]} создал заявку`);if(editingDraftId){let old=find(editingDraftId);if(old){req.id=old.id;req.audit=old.audit||[];audit(req,onlySave?'Черновик обновлён':'Черновик отправлен в лабораторию');data[data.indexOf(old)]=req}else data.unshift(req)}else data.unshift(req);save();draft=null;editingDraftId='';go(role==='manager'||onlySave?'dashboard':'request',req.id)}
  function nextOrder(dir){let yy=today().slice(2,4),pre=(dir==='gen'?'Г':'И')+yy+'/';let n=Math.max(0,...data.filter(r=>r.number?.startsWith(pre)).map(r=>parseInt(r.number.slice(pre.length),10)||0))+1;return pre+n}

  function confirmIntake(){let req=find(selected);if(!req)return;let undecided=req.samples.filter(s=>s.state==='pending');if(undecided.length){alert(`Отметьте все пробы. Осталось: ${undecided.length}`);return}let accepted=req.samples.filter(s=>s.state==='accepted');let rejected=req.samples.filter(s=>s.state==='rejected');if(!req.number)req.number=nextOrder(req.direction);accepted.forEach(s=>{if(!s.number)s.number=nextSample(req.direction)});req.received=today();req.status=accepted.length?(rejected.length?'partial':'registered'):'rejected';audit(req,`Лаборант подтвердил приёмку: принято ${accepted.length}, не принято ${rejected.length}`);save();render()}
  function exportCsv(){let rows=[['Направление','Заявка','Заказчик','Рег. № образца','Обозначение','Материал','Исследования']];data.forEach(r=>r.samples.filter(s=>s.number).forEach(s=>rows.push([directions[r.direction],r.number,r.customer,s.number,s.identifier,s.type,s.tests.map(t=>tname(r.direction,t)).join('; ')])));let text='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\r\n');let url=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download='algimed-lab-reestr-demo.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
  document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,id=b.dataset.id;switch(a){case'role':pickRole(b.dataset.role);break;case'go':if(b.dataset.page==='new')startNew();else go(b.dataset.page);break;case'new':startNew();break;case'open':go('request',id);break;case'edit-draft':{let req=find(selected);if(req&&req.status==='draft'){editingDraftId=req.id;draft={direction:req.direction,customer:req.customer,contract:req.contract,samples:structuredClone(req.samples)};go('new')}break}case'add-draft-sample':draft.samples.push(newSample());render();break;case'remove-draft-sample':draft.samples=draft.samples.filter(s=>s.id!==id);render();break;case'toggle-tests':{let s=draft.samples.find(s=>s.id===id);s.showTests=!s.showTests;testQuery='';render();break}case'save-draft':submitDraft(true);break;case'submit-draft':submitDraft(false);break;case'reg-tab':registryTab=b.dataset.tab;render();break;case'export':exportCsv();break;case'sample-accept':{let s=find(selected)?.samples.find(s=>s.id===id);if(s){s.state='accepted';s.reason='';save();render()}break}case'sample-reject':showModal({type:'reject',id,title:'Причина непринятия пробы',body:'<label class="field"><span>Причина *</span><textarea id="modal-input" placeholder="Например, пробирка повреждена"></textarea></label>',confirm:'Отметить пробу',warning:true});break;case'add-intake-sample':showModal({type:'intake-add',title:'Добавить незаявленную пробу',body:'<label class="field"><span>Обозначение *</span><input id="modal-input" placeholder="Номер на пробирке"></label><label class="field"><span>Материал</span><select id="modal-type"><option>кровь</option><option>сыворотка</option><option>мазок</option><option>молоко</option><option>другое</option></select></label>',confirm:'Добавить в заявку'});break;case'confirm-intake':confirmIntake();break;case'add-test':{let r=find(selected);showModal({type:'test',id,title:'Дополнительное исследование',body:`<p class="muted">Образец № ${h(r.samples.find(s=>s.id===id)?.number)}</p><label class="field"><span>Исследование</span><select id="modal-input">${cat[r.direction].map(t=>`<option value="${h(t.id)}">${h(t.name)}</option>`).join('')}</select></label>`,confirm:'Назначить'});break}case'correct':{let r=find(selected),s=r.samples.find(s=>s.id===id);showModal({type:'correct',id,title:'Исправление зарегистрированной записи',body:`<label class="field"><span>Обозначение</span><input id="modal-input" value="${h(s.identifier)}"></label><label class="field"><span>Причина исправления *</span><textarea id="modal-reason" placeholder="Почему исправляется запись"></textarea></label>`,confirm:'Сохранить исправление'});break}case'import-demo':showModal({type:'info',title:'Импорт Excel',body:'<p>Это макет будущего импорта. Файл не читается, реестр не изменяется.</p>',confirm:'Понятно'});break;case'modal-cancel':modal=null;renderModal();break;case'modal-confirm':{let m=modal,req=find(selected),v=$('modal-input')?.value?.trim();if(m.type==='reject'){if(!v){alert('Укажите причину');return}let s=req.samples.find(s=>s.id===m.id);s.state='rejected';s.reason=v;audit(req,`Проба ${s.identifier}: не принята. ${v}`);save()}if(m.type==='intake-add'){if(!v){alert('Укажите обозначение');return}let s=newSample();s.identifier=v;s.type=$('modal-type').value;req.samples.push(s);audit(req,`Лаборант добавил незаявленную пробу ${v}`);save()}if(m.type==='test'){let s=req.samples.find(s=>s.id===m.id);s.tests.push(v);audit(req,`К образцу № ${s.number} добавлено исследование ${tname(req.direction,v)}`);save()}if(m.type==='correct'){let reason=$('modal-reason').value.trim();if(!v||!reason){alert('Укажите значение и причину');return}let s=req.samples.find(s=>s.id===m.id),old=s.identifier;s.identifier=v;audit(req,`Руководитель исправил обозначение ${old} → ${v}. Причина: ${reason}`);save()}modal=null;render();break}}});
  document.addEventListener('input',e=>{let el=e.target;if(!draft&&el.id!=='registry-search')return;if(el.dataset.field)draft[el.dataset.field]=el.value;if(el.dataset.sample){let s=draft.samples.find(x=>x.id===el.dataset.sample);if(s)s[el.dataset.key]=el.value}if(el.id==='registry-search'){registryQuery=el.value;let p=el.selectionStart;render();let input=$('registry-search');input?.focus();input?.setSelectionRange(p,p)}if(el.dataset.action==='test-search'){testQuery=el.value;let sid=el.dataset.id;let p=el.selectionStart;render();let s=el.closest?.('.sample-card');let target=[...document.querySelectorAll('[data-action="test-search"]')].find(x=>x.dataset.id===sid);target?.focus();target?.setSelectionRange(p,p)}});
  document.addEventListener('change',e=>{let el=e.target;if(el.id==='direction'&&draft){draft.direction=el.value;draft.samples.forEach(s=>{s.tests=[];s.showTests=false});render()}if(el.dataset.testFor&&draft){let s=draft.samples.find(x=>x.id===el.dataset.testFor);if(s){if(el.checked&&!s.tests.includes(el.value))s.tests.push(el.value);if(!el.checked)s.tests=s.tests.filter(x=>x!==el.value)}}});
  $('brand').addEventListener('click',e=>{e.preventDefault();role='';go('home')});$('switchRole').addEventListener('click',()=>{role='';go('home')});render();
  })();
  </script>
</body>
